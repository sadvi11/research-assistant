name: CI

# Two jobs on purpose.
#
# `tests` installs only what the tests actually import. The heavy dependencies
# (sentence-transformers, psycopg, pypdf) are imported lazily behind ImportError
# guards, so the suite runs in under a second without downloading PyTorch.
#
# `pgvector` exists because PgVectorStore had zero coverage until the
# 2026-09-14 audit: its tests skip themselves when no database is reachable, so
# on a laptop "9 skipped" looks like success. A service container makes them run.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests and an offline evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install only what the tests import
        run: pip install pytest httpx fastapi pydantic

      - name: Tests
        run: python -m pytest -q

      - name: The whole pipeline runs offline, with no credentials and no cost
        run: python scripts/evaluate.py --dry-run

  pgvector:
    name: pgvector integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research -d research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install pytest httpx fastapi pydantic "psycopg[binary]"

      - name: The integration tests must RUN, not skip
        env:
          RA_TEST_DATABASE_URL: postgresql://research:research@localhost:5432/research
        run: |
          python -m pytest tests/test_pgvector_integration.py -q -rs 2>&1 | tee out.txt
          if grep -qE '[0-9]+ skipped' out.txt; then
            echo "::error::pgvector tests skipped - the database was not reachable, so this job proved nothing."
            exit 1
          fi

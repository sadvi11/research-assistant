<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Assistant</title>
<style>
  :root{--bg:#fbfbfa;--panel:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e4e4e1;
        --accent:#2f5d50;--warn:#8a5a00;--warn-bg:#fdf6e3;--bad:#8a2222;--ok:#2f5d50;}
  @media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1e1e1d;--ink:#eceae5;
        --muted:#9a9a95;--line:#31312f;--accent:#7fbfa9;--warn:#d9a441;--warn-bg:#2a2418;--bad:#e08585;--ok:#7fbfa9;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  header{padding:22px 28px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{margin:0;font-size:19px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;padding:22px 28px;
       max-width:1400px;margin:0 auto;align-items:start}
  @media(max-width:980px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}
  textarea{width:100%;min-height:78px;padding:11px;border:1px solid var(--line);border-radius:8px;
           font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px}
  label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 20px;
         font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  select{padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
  .answer{white-space:pre-wrap;font-size:15.5px}
  .status{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:12px}
  .status.answered{background:rgba(47,93,80,.14);color:var(--ok)}
  .status.insufficient_evidence,.status.refused{background:var(--warn-bg);color:var(--warn)}
  .status.error{background:rgba(138,34,34,.12);color:var(--bad)}
  .notes{background:var(--warn-bg);border-left:3px solid var(--warn);padding:11px 14px;
         border-radius:0 7px 7px 0;margin:14px 0;font-size:13.5px}
  .notes li{margin:3px 0}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
     margin:0 0 12px;font-weight:700}
  .cite{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;cursor:pointer;
        background:var(--bg);transition:border-color .12s}
  .cite:hover{border-color:var(--accent)}
  .cite-h{display:flex;gap:8px;align-items:baseline}
  .num{font-weight:700;color:var(--accent);font-size:13px}
  .cite-t{font-weight:600;font-size:13.5px;flex:1}
  .url{color:var(--muted);font-size:12px;word-break:break-all;margin-top:3px}
  .tier{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;margin-top:6px;font-weight:600}
  .t1{background:rgba(47,93,80,.15);color:var(--ok)} .t2{background:rgba(70,100,160,.15);color:#5577bb}
  .t3{background:rgba(120,120,120,.15);color:var(--muted)} .t4{background:rgba(138,34,34,.12);color:var(--bad)}
  .quote{border-left:2px solid var(--line);padding-left:10px;margin-top:8px;font-size:13px;
         color:var(--muted);font-style:italic}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}
  .metric{padding:9px;background:var(--bg);border-radius:7px}
  .metric b{display:block;font-size:17px;font-weight:700}
  .metric span{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
  .claim{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
  .claim:last-child{border:0}
  .cs{font-size:11px;font-weight:700;margin-right:6px}
  .cs.supported{color:var(--ok)} .cs.unsupported{color:var(--warn)} .cs.contradicted{color:var(--bad)}
  dialog{border:1px solid var(--line);border-radius:12px;padding:0;max-width:680px;width:92vw;
         background:var(--panel);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
  .dlg-b{padding:18px 22px;max-height:62vh;overflow:auto}
  .kv{display:grid;grid-template-columns:132px 1fr;gap:7px 14px;font-size:13px;margin-bottom:16px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
  .passage{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;
           font-size:13.5px;white-space:pre-wrap;line-height:1.65}
  .x{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;padding:0;line-height:1}
  .empty{color:var(--muted);font-size:13.5px;font-style:italic}
</style>
</head>
<body>
<header>
  <h1>Research Assistant</h1>
  <div class="sub">Answers only from retrieved, trusted sources. Every claim is verified before it is shown.</div>
</header>

<main>
  <div>
    <div class="card">
      <textarea id="q" placeholder="Ask a research question…"></textarea>
      <div class="row">
        <button id="go">Research</button>
        <label><input type="checkbox" id="mode"> Research mode (decompose &amp; compare)</label>
        <label>Minimum trust
          <select id="tier">
            <option value="">Any</option>
            <option value="1">Tier 1 only</option>
            <option value="2">Tier 1–2</option>
            <option value="3">Tier 1–3</option>
          </select>
        </label>
      </div>
    </div>
    <div class="card" id="out" hidden></div>
  </div>

  <aside>
    <div class="card" id="ev" hidden>
      <h2>Evidence</h2>
      <div class="metrics" id="metrics"></div>
    </div>
    <div class="card" id="src" hidden>
      <h2>Sources</h2>
      <div id="cites"></div>
    </div>
    <div class="card" id="clm" hidden>
      <h2>Claim verification</h2>
      <div id="claims"></div>
    </div>
  </aside>
</main>

<dialog id="dlg">
  <div class="dlg-h"><strong id="dt">Evidence</strong><button class="x" onclick="dlg.close()">&times;</button></div>
  <div class="dlg-b" id="db"></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('go').onclick = async () => {
  const question = $('q').value.trim();
  if (!question) return;
  $('go').disabled = true; $('go').textContent = 'Researching…';
  try {
    const res = await fetch('/api/research', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        question,
        research_mode: $('mode').checked,
        max_tier: $('tier').value ? Number($('tier').value) : null
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Request failed');
    render(data);
  } catch (e) {
    $('out').hidden = false;
    $('out').innerHTML = `<span class="status error">error</span><div>${esc(e.message)}</div>`;
  } finally {
    $('go').disabled = false; $('go').textContent = 'Research';
  }
};

function render(d) {
  $('out').hidden = false;
  let html = `<span class="status ${d.status}">${d.status.replace(/_/g,' ')}</span>`;
  if (d.subquestions?.length)
    html += `<div class="notes"><strong>Sub-questions</strong><ul>${d.subquestions.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`;
  html += `<div class="answer">${esc(d.answer)}</div>`;
  if (d.uncertainty_notes?.length)
    html += `<div class="notes"><strong>Caveats</strong><ul>${d.uncertainty_notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;
  if (d.conflicts?.length)
    html += `<div class="notes"><strong>Sources disagree</strong><ul>${d.conflicts.map(c=>
      `<li>${esc(c.topic)}: ${esc(c.position_a)} vs ${esc(c.position_b)}</li>`).join('')}</ul></div>`;
  $('out').innerHTML = html;

  const e = d.evidence || {};
  $('ev').hidden = false;
  $('metrics').innerHTML = [
    ['Chunks retrieved', e.chunks_retrieved ?? 0],
    ['Tier 1 sources', e.tier_1_sources ?? 0],
    ['Independent domains', e.independent_sources ?? 0],
    ['Best relevance', e.best_relevance_score != null ? e.best_relevance_score.toFixed(2) : '—'],
    ['Claims checked', e.claims_total ?? 0],
    ['Claims supported', e.claims_supported ?? 0],
  ].map(([k,v]) => `<div class="metric"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');

  $('src').hidden = !(d.citations?.length);
  $('cites').innerHTML = (d.citations||[]).map(c => `
    <div class="cite" onclick="inspect('${esc(c.chunk_id)}')">
      <div class="cite-h"><span class="num">[${c.index}]</span><span class="cite-t">${esc(c.title)}</span></div>
      <div class="url">${esc(c.url)}</div>
      <span class="tier t${c.tier}">Tier ${c.tier}${c.relevance_score!=null?' · '+c.relevance_score.toFixed(2):''}</span>
      <div class="quote">“${esc(c.cited_text)}”</div>
    </div>`).join('');

  $('clm').hidden = !(d.claims?.length);
  $('claims').innerHTML = (d.claims||[]).map(c =>
    `<div class="claim"><span class="cs ${c.status}">${c.status.toUpperCase()}</span>${esc(c.text)}</div>`).join('');
}

async function inspect(chunkId) {
  const res = await fetch('/api/evidence/' + encodeURIComponent(chunkId));
  if (!res.ok) return;
  const c = await res.json();
  $('dt').textContent = c.title;
  $('db').innerHTML = `
    <dl class="kv">
      <dt>URL</dt><dd><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a></dd>
      <dt>Domain</dt><dd>${esc(c.domain)}</dd>
      <dt>Trust tier</dt><dd>${esc(c.tier_label)}</dd>
      <dt>Source type</dt><dd>${esc(c.source_type)}</dd>
      <dt>Section</dt><dd>${esc((c.section_path||[]).join(' › ') || '—')}</dd>
      <dt>Published</dt><dd>${esc(c.publication_date || 'unknown')}</dd>
      <dt>Author</dt><dd>${esc(c.author || 'unknown')}</dd>
      <dt>Retrieved</dt><dd>${esc(c.retrieved_at)}</dd>
      <dt>Chunk ID</dt><dd><code>${esc(c.chunk_id)}</code></dd>
      <dt>Offsets</dt><dd>${c.char_start}–${c.char_end}</dd>
    </dl>
    <h2>Supporting passage</h2>
    <div class="passage">${esc(c.text)}</div>`;
  $('dlg').showModal();
}
</script>
</body>
</html>
